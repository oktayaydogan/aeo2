name: Branch Verify

on:
  push:
    branches:
      - feat/economic-dropoff-buildings

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --workspaces --include=dev
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
